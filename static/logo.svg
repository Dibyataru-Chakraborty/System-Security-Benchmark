<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="samuraiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#samuraiGrad)" stroke="#F87171" stroke-width="2" filter="url(#glow)" />

  <!-- Inner Cyber Tech Circuit lines -->
  <polyline points="20,32 50,16 80,32" fill="none" stroke="#FECACA" stroke-width="1.5" opacity="0.6" />
  <polyline points="20,68 50,84 80,68" fill="none" stroke="#FECACA" stroke-width="1.5" opacity="0.6" />

  <!-- Samurai Helmet / Crest (Kabuto) -->
  <path d="M 50,18 L 62,34 L 50,30 L 38,34 Z" fill="#FFFFFF" opacity="0.95" />
  <path d="M 28,38 C 36,32 64,32 72,38 L 76,52 C 72,56 66,58 50,58 C 34,58 28,56 24,52 Z" fill="#18181B" stroke="#F87171" stroke-width="1.5" />

  <!-- Samurai Menpo (Face Mask & Slits) -->
  <polygon points="32,54 68,54 62,72 50,80 38,72" fill="#09090B" stroke="#EF4444" stroke-width="1.5" />
  <!-- Menpo Teeth / Circuit Grille -->
  <line x1="42" y1="62" x2="58" y2="62" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
  <line x1="45" y1="68" x2="55" y2="68" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cyber Eyes -->
  <polygon points="36,46 44,48 43,44" fill="#38BDF8" />
  <polygon points="64,46 56,48 57,44" fill="#38BDF8" />

  <!-- Crossed Cyber Katanas (Blades Accent) -->
  <line x1="16" y1="84" x2="84" y2="16" stroke="url(#bladeGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="84" y1="84" x2="16" y2="16" stroke="url(#bladeGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
</svg>

